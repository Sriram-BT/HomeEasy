<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>React App</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- ✅ Load only the base Google Maps JavaScript API -->
   <script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCGkYILyp7Bf1YGw66HsSD3R6z7XZbJFfg"
  async
  defer
></script>


    <!--
      ⚡ Notes:
      - Do NOT include "&libraries=places" → that’s for the legacy API.
      - The new Places API loads dynamically with "importLibrary('places')" in your JS code.
      - Ensure that both "Maps JavaScript API" and "Places API (New)" are enabled.
      - API key restrictions:
          - Application restriction: Websites
          - Allowed websites: http://localhost:3000/*, http://127.0.0.1:3000/*
          - API restriction: Only Maps JavaScript API + Places API (New)
    -->
  </body>
</html>
